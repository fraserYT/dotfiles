# PhpStorm "Dark" (New UI) look for kitty. Made 25 Nov 2026.
#
# Exact, from PhpStorm 2025.1's bundled scheme (lib/app-client.jar, themes/expUI/expUI_darkScheme.xml):
#   background 1e1f22 (CONSOLE_BACKGROUND_KEY), foreground bcbec4 (TEXT / CONSOLE_NORMAL_OUTPUT),
#   cursor ced0d6 (CARET_COLOR), red f75464 (CONSOLE_ERROR_OUTPUT), green 6aab73 (CONSOLE_USER_INPUT).
# Not exact: PhpStorm takes its other ANSI colours from code, not a scheme file, so the rest are the
# Dark scheme's own syntax colours (functions 56a8f5, numbers 2aacb8, keywords cf8e6d, purple c77dbb),
# chosen to sit in the same soft, low-contrast family.

background            #1e1f22
foreground            #bcbec4
cursor                #ced0d6
cursor_text_color     #1e1f22
selection_background  #214283
selection_foreground  none
url_color             #56a8f5

# black
color0   #2b2d30
color8   #6f737a
