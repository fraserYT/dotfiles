# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/00-Default.conf

font_family FantasqueSansM Nerd Font Mono Bold
font_size 16.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 1.0
dynamic_background_opacity 1
confirm_os_window_close -1

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4

selection_foreground none
selection_background none

foreground #dddddd
background #000000
cursor #dddddd

# Strip trailing whitespace at copy time so padded code blocks copy clean
strip_trailing_spaces smart

# Copy/paste to match PhpStorm terminal behaviour
# ctrl+c copies if text is selected, otherwise sends SIGINT as normal
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
# Disable close-window shortcut; accidental closes lost work (2026-10-15)
map ctrl+shift+w no_op

# Session persistence (19 Oct 2026). Remote control on a per-user socket so a user timer
# (~/.local/bin/kitty-session-save, kitty-session-save.timer) can snapshot every open kitty's
# tabs and working directories to ~/.config/kitty/last.kitty-session every two minutes; Hyprland
# restores that file once at login (Startup_Apps.conf). socket-only: nothing inside a terminal
# can drive kitty, only a process that can reach the socket, which is this user. The PID is
# appended to the socket name, one per kitty instance.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-sock
